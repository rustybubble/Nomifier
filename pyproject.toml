[project]
name = "nomifier"
version = "0.1.0"
description = "Nomify everything in view, live. Built on BDBI's Nomi."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jsonschema>=4.23",
  "nomi-schema @ git+https://github.com/gt-big-data/nomi@aa8d723e99fb22853023d8f66e54e3dbe04f52a1#subdirectory=packages/schema",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["server/tests", "scripts"]
